name: Semgrep Security Scan

on:
  push:
    branches:
      - main
      - feature/backend-api
  pull_request:
    branches:
      - main
      - feature/backend-api

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep scan --config p/javascript